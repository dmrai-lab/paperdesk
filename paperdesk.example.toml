# paperdesk: the review desk of one document, a LaTeX paper or a Word file. Copy to paperdesk.toml and point it at
# your document. Paths are relative to this file; comments, voice notes and auth.json live beside it.
[paper]
dir = "../my-paper"                 # the folder with the sources
main = "main.tex"                   # the root file; the PDF is <main>.pdf beside it
build = "latexmk -pdf -synctex=1 -interaction=nonstopmode -halt-on-error main.tex"   # what the rebuild button runs
# A Word document instead: the anchor is then the paragraph, resolved through the PDF's text.
# main = "report.docx"
# build = "soffice --headless --convert-to pdf --outdir . report.docx"

[people]
reviewer = "reviewer"               # who comments on the page
editor = "editor"                   # who answers from the terminal (a person, or an agent such as Claude Code)

[server]
host = "127.0.0.1"                  # 0.0.0.0 to reach it on the network; see tunnel.sh for the internet
port = 8765

[voice]
# Voice notes are transcribed on the machine by faster-whisper (pip install faster-whisper) when it is installed.
# The glossary is the vocabulary the transcriber is told to expect: put your field's jargon, names and acronyms here.
model = "small"                     # large-v3 is affordable on a GPU and hears jargon better
# device = "auto"                   # auto (a CUDA device when CTranslate2 sees one, else the CPU) | cpu | cuda
# compute_type = "int8"             # default: float16 on cuda, int8 on cpu
# cpu_threads = 4                   # cpu only; default half the cores, at most eight
glossary = "diffusion MRI, Monte Carlo, LaTeX, figure, table, caption, methods, results"
